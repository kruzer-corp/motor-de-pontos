<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor de Pontos — Jornada End-to-End</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --admin-color:    #3151CE; --admin-light:    #EEF2FF; --admin-dark:    #1D317C;
      --afil-color:     #F79009; --afil-light:     #FFF7ED; --afil-dark:     #B54708;
      --membro-color:   #12B76A; --membro-light:   #ECFDF5; --membro-dark:   #027A48;
      --op-color:       #F04438; --op-light:       #FEF2F2; --op-dark:       #B42318;
      --navy:           #232534; --muted:          #63698A; --border:        #E3E3ED;
      --bg:             #F4F4F8; --card:           #FFFFFF;
      --cell:           160px;
      --row-gap:        12px;
      --header-w:       200px;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Page header ──────────────────────────────────────────────── */
    .page-header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 24px 40px 20px;
    }
    .page-header h1 {
      font-size: 22px; font-weight: 700;
      font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
      letter-spacing: -.3px;
    }
    .page-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* ── Stage columns header ─────────────────────────────────────── */
    .stage-header-row {
      display: flex;
      align-items: center;
      padding: 16px 40px 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .stage-header-spacer { width: var(--header-w); flex-shrink: 0; }
    .stage-cols { display: flex; gap: 8px; }
    .stage-col-header {
      width: var(--cell); flex-shrink: 0;
      text-align: center;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    .stage-col-header .stage-num {
      display: block;
      font-size: 10px; font-weight: 400; opacity: .6;
      margin-bottom: 3px;
    }

    /* ── Journey container ────────────────────────────────────────── */
    .journey-wrap {
      padding: 20px 40px 60px;
      overflow-x: auto;
      position: relative;
    }
    #journey {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--row-gap);
      min-width: max-content;
    }

    /* ── SVG overlay ─────────────────────────────────────────────── */
    #svg-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    /* ── Lane ────────────────────────────────────────────────────── */
    .lane {
      display: flex;
      align-items: stretch;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .lane-header {
      width: var(--header-w);
      flex-shrink: 0;
      padding: 20px 20px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      border-right: 1px solid var(--border);
    }
    .lane-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .lane-name {
      font-size: 14px; font-weight: 600; line-height: 1.2;
    }
    .lane-role {
      font-size: 11px; color: var(--muted); line-height: 1.4;
    }

    .lane-content {
      display: flex;
      align-items: center;
      padding: 16px 8px;
      gap: 8px;
      flex: 1;
    }

    /* ── Cell (one per stage) ────────────────────────────────────── */
    .cell {
      width: var(--cell); flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Step card ───────────────────────────────────────────────── */
    .step {
      width: calc(var(--cell) - 8px);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid;
      font-size: 12px; line-height: 1.4;
      text-align: center;
      cursor: default;
      transition: transform .15s, box-shadow .15s;
      position: relative;
    }
    .step:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .step .step-label { font-weight: 600; display: block; }
    .step .step-sub   { font-size: 10.5px; opacity: .7; display: block; margin-top: 2px; }

    /* ── Empty cell placeholder ──────────────────────────────────── */
    .empty {
      width: calc(var(--cell) - 8px);
      height: 52px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      opacity: .35;
    }

    /* ── Arrows within lane ──────────────────────────────────────── */
    .in-arrow {
      font-size: 14px; color: var(--border); flex-shrink: 0;
      display: flex; align-items: center; user-select: none;
    }

    /* ── Persona color tokens ────────────────────────────────────── */
    .admin  .lane-header { background: var(--admin-light);  border-color: var(--border); }
    .admin  .lane-avatar { background: var(--admin-color);  color: #fff; }
    .admin  .lane-name   { color: var(--admin-dark); }
    .admin  .step        { background: var(--admin-light);  border-color: var(--admin-color); color: var(--admin-dark); }
    .admin  .step:hover  { background: #DDE4FF; }

    .afil   .lane-header { background: var(--afil-light); }
    .afil   .lane-avatar { background: var(--afil-color);  color: #fff; }
    .afil   .lane-name   { color: var(--afil-dark); }
    .afil   .step        { background: var(--afil-light);  border-color: var(--afil-color); color: var(--afil-dark); }

    .membro .lane-header { background: var(--membro-light); }
    .membro .lane-avatar { background: var(--membro-color); color: #fff; }
    .membro .lane-name   { color: var(--membro-dark); }
    .membro .step        { background: var(--membro-light); border-color: var(--membro-color); color: var(--membro-dark); }

    .op     .lane-header { background: var(--op-light); }
    .op     .lane-avatar { background: var(--op-color);    color: #fff; }
    .op     .lane-name   { color: var(--op-dark); }
    .op     .step        { background: var(--op-light);    border-color: var(--op-color); color: var(--op-dark); }

    /* ── Legend ──────────────────────────────────────────────────── */
    .legend {
      display: flex; gap: 24px; flex-wrap: wrap;
      padding: 0 40px 40px;
      font-size: 12px; color: var(--muted);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-line-solid {
      width: 28px; height: 2px; background: var(--muted); border-radius: 2px;
    }
    .legend-line-dashed {
      width: 28px; height: 2px;
      border-top: 2px dashed #A9ADC0;
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    /* ── Highlight on connection hover ───────────────────────────── */
    .step.highlighted { outline: 2px solid var(--navy); outline-offset: 2px; z-index: 2; }
    path.conn-highlighted { opacity: 1 !important; }

    @media (max-width: 900px) {
      .page-header, .stage-header-row, .journey-wrap, .legend { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

<header class="page-header">
  <h1>Motor de Pontos — Jornada End-to-End</h1>
  <p>Ciclo completo do programa de fidelidade · 4 perfis · 10 etapas</p>
</header>

<div class="stage-header-row">
  <div class="stage-header-spacer"></div>
  <div class="stage-cols" id="stage-cols"></div>
</div>

<div class="journey-wrap">
  <div id="journey">
    <svg id="svg-overlay"></svg>
    <!-- lanes injected by JS -->
  </div>
</div>

<div class="legend">
  <span style="font-weight:600; color: var(--navy);">Legenda:</span>
  <div class="legend-item">
    <div class="legend-line-solid"></div> Fluxo sequencial do perfil
  </div>
  <div class="legend-item">
    <div class="legend-line-dashed"></div> Handoff entre perfis
  </div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--admin-color)"></div> Admin</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--afil-color)"></div> Afiliado/Vendedor</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--membro-color)"></div> Membro/Cliente</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--op-color)"></div> Operador</div>
</div>

<script>
// ─── Data ─────────────────────────────────────────────────────────────────────

const STAGES = [
  { id:"setup",    label:"Setup",      num:"01" },
  { id:"indic",    label:"Indicação",  num:"02" },
  { id:"compra",   label:"Compra",     num:"03" },
  { id:"acumulo",  label:"Acúmulo",    num:"04" },
  { id:"tier",     label:"Tier",       num:"05" },
  { id:"camp",     label:"Campanha",   num:"06" },
  { id:"resgate",  label:"Resgate",    num:"07" },
  { id:"aprov",    label:"Aprovação",  num:"08" },
  { id:"entrega",  label:"Entrega",    num:"09" },
  { id:"analise",  label:"Análise",    num:"10" },
];

const PERSONAS = [
  {
    id: "admin", cls: "admin", emoji: "⚙️",
    name: "Admin", role: "Configura e supervisiona",
    steps: {
      setup:   { id:"a-setup",   label:"Define Tiers",      sub:"e Regras do programa"   },
      acumulo: { id:"a-acumulo", label:"Cria Campanhas",    sub:"de pontos extras"        },
      tier:    { id:"a-tier",    label:"Monitora Dashboard",sub:"KPIs e progressão"       },
      aprov:   { id:"a-aprov",   label:"Supervisiona",      sub:"fila de aprovações"      },
      analise: { id:"a-analise", label:"Analisa Resultados",sub:"e otimiza o programa"    },
    }
  },
  {
    id: "afil", cls: "afil", emoji: "🤝",
    name: "Afiliado / Vendedor", role: "Indica e acompanha comissões",
    steps: {
      setup:   { id:"af-setup",   label:"Cadastra",         sub:"no programa"             },
      indic:   { id:"af-indic",   label:"Indica venda",     sub:"ou novo cliente"         },
      acumulo: { id:"af-acumulo", label:"Acumula comissão", sub:"em pontos"               },
      tier:    { id:"af-tier",    label:"Ver Ranking",      sub:"de indicações"           },
    }
  },
  {
    id: "membro", cls: "membro", emoji: "👤",
    name: "Membro / Cliente", role: "Participa, acumula e resgata",
    steps: {
      setup:   { id:"m-setup",   label:"Cadastra",          sub:"no programa"             },
      compra:  { id:"m-compra",  label:"Realiza compra",    sub:"gera pontos"             },
      acumulo: { id:"m-acumulo", label:"Acumula pontos",    sub:"saldo cresce"            },
      tier:    { id:"m-tier",    label:"Sobe de Tier",      sub:"Bronze → Diamante"       },
      camp:    { id:"m-camp",    label:"Recebe comunicado", sub:"campanha ativa"          },
      resgate: { id:"m-resgate", label:"Solicita resgate",  sub:"escolhe recompensa"      },
      aprov:   { id:"m-aprov",   label:"Aguarda aprovação", sub:"notificado do status"    },
      entrega: { id:"m-entrega", label:"Recebe recompensa", sub:"resgate concluído"       },
    }
  },
  {
    id: "op", cls: "op", emoji: "🔧",
    name: "Operador", role: "Aprova resgates e executa",
    steps: {
      resgate: { id:"op-resgate", label:"Monitora fila",    sub:"de resgates"             },
      aprov:   { id:"op-aprov",   label:"Aprova / Rejeita", sub:"analisa solicitação"     },
      entrega: { id:"op-entrega", label:"Processa entrega", sub:"emite documentação"      },
      analise: { id:"op-analise", label:"Registra auditoria",sub:"histórico de operações" },
    }
  },
];

// Connections: from-id → to-id with label + color
const CONNECTIONS = [
  { from:"af-indic",   to:"m-compra",   label:"indicação gera compra",       color:"#F79009" },
  { from:"m-acumulo",  to:"af-acumulo", label:"comissão creditada",           color:"#12B76A" },
  { from:"a-acumulo",  to:"m-camp",     label:"campanha dispara comunicado",  color:"#3151CE" },
  { from:"m-resgate",  to:"op-resgate", label:"pedido entra na fila",         color:"#12B76A" },
  { from:"op-aprov",   to:"m-aprov",    label:"status notificado ao membro",  color:"#F04438" },
  { from:"op-aprov",   to:"m-entrega",  label:"aprovado → entrega",           color:"#F04438" },
  { from:"op-analise", to:"a-analise",  label:"dados para análise",           color:"#F04438" },
];

// ─── Build stage headers ───────────────────────────────────────────────────────

const stageCols = document.getElementById("stage-cols");
STAGES.forEach(s => {
  const div = document.createElement("div");
  div.className = "stage-col-header";
  div.innerHTML = `<span class="stage-num">${s.num}</span>${s.label}`;
  stageCols.appendChild(div);
});

// ─── Build lanes ──────────────────────────────────────────────────────────────

const journey = document.getElementById("journey");
const stepMap = {}; // id → DOM element

PERSONAS.forEach(persona => {
  const lane = document.createElement("div");
  lane.className = `lane ${persona.cls}`;

  // Header
  const header = document.createElement("div");
  header.className = "lane-header";
  header.innerHTML = `
    <div class="lane-avatar">${persona.emoji}</div>
    <div class="lane-name">${persona.name}</div>
    <div class="lane-role">${persona.role}</div>
  `;
  lane.appendChild(header);

  // Content
  const content = document.createElement("div");
  content.className = "lane-content";

  STAGES.forEach((stage, i) => {
    const stepData = persona.steps[stage.id];

    const cell = document.createElement("div");
    cell.className = "cell";

    if (stepData) {
      const step = document.createElement("div");
      step.className = "step";
      step.dataset.stepId = stepData.id;
      step.innerHTML = `
        <span class="step-label">${stepData.label}</span>
        <span class="step-sub">${stepData.sub}</span>
      `;
      cell.appendChild(step);
      stepMap[stepData.id] = step;
    } else {
      const empty = document.createElement("div");
      empty.className = "empty";
      cell.appendChild(empty);
    }

    content.appendChild(cell);

    // Add arrow between cells (not after last)
    if (i < STAGES.length - 1) {
      const arr = document.createElement("div");
      arr.className = "in-arrow";
      arr.innerHTML = "›";
      content.appendChild(arr);
    }
  });

  lane.appendChild(content);
  journey.appendChild(lane);
});

// ─── Draw SVG connections ──────────────────────────────────────────────────────

function drawConnections() {
  const svg = document.getElementById("svg-overlay");
  const container = journey;
  const containerRect = container.getBoundingClientRect();

  svg.innerHTML = ""; // clear

  // Defs (arrowhead markers)
  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  CONNECTIONS.forEach((conn, i) => {
    const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
    marker.setAttribute("id", `arrow-${i}`);
    marker.setAttribute("viewBox", "0 0 10 10");
    marker.setAttribute("refX", "9");
    marker.setAttribute("refY", "5");
    marker.setAttribute("markerWidth", "6");
    marker.setAttribute("markerHeight", "6");
    marker.setAttribute("orient", "auto-start-reverse");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
    path.setAttribute("fill", conn.color);
    marker.appendChild(path);
    defs.appendChild(marker);
  });
  svg.appendChild(defs);

  CONNECTIONS.forEach((conn, i) => {
    const fromEl = stepMap[conn.from];
    const toEl   = stepMap[conn.to];
    if (!fromEl || !toEl) return;

    const fromRect = fromEl.getBoundingClientRect();
    const toRect   = toEl.getBoundingClientRect();
    const scrollX  = window.scrollX || 0;
    const scrollY  = window.scrollY || 0;

    // Relative to journey container
    const cx = containerRect.left + scrollX;
    const cy = containerRect.top  + scrollY;

    const fromCX = (fromRect.left + fromRect.width  / 2) + scrollX - cx;
    const fromCY = (fromRect.top  + fromRect.height / 2) + scrollY - cy;
    const toCX   = (toRect.left   + toRect.width   / 2) + scrollX - cx;
    const toCY   = (toRect.top    + toRect.height  / 2) + scrollY - cy;

    // Determine exit/entry points
    let x1, y1, x2, y2;
    const sameLane = Math.abs(fromCY - toCY) < 10;

    if (sameLane) {
      // horizontal: exit right, enter left
      x1 = fromRect.right  + scrollX - cx;
      y1 = fromCY;
      x2 = toRect.left     + scrollX - cx;
      y2 = toCY;
    } else if (toCY > fromCY) {
      // going down: exit bottom, enter top
      x1 = fromCX;
      y1 = fromRect.bottom + scrollY - cy;
      x2 = toCX;
      y2 = toRect.top      + scrollY - cy;
    } else {
      // going up: exit top, enter bottom
      x1 = fromCX;
      y1 = fromRect.top    + scrollY - cy;
      x2 = toCX;
      y2 = toRect.bottom   + scrollY - cy;
    }

    // Cubic bezier control points
    const dx = Math.abs(x2 - x1);
    const dy = Math.abs(y2 - y1);
    let cp1x, cp1y, cp2x, cp2y;

    if (sameLane) {
      const mid = (x1 + x2) / 2;
      cp1x = mid; cp1y = y1;
      cp2x = mid; cp2y = y2;
    } else {
      cp1x = x1;        cp1y = y1 + dy * .5;
      cp2x = x2;        cp2y = y2 - dy * .5;
    }

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", conn.color);
    path.setAttribute("stroke-width", "2");
    path.setAttribute("stroke-dasharray", "5,3");
    path.setAttribute("opacity", "0.65");
    path.setAttribute("marker-end", `url(#arrow-${i})`);
    path.dataset.from = conn.from;
    path.dataset.to   = conn.to;
    svg.appendChild(path);

    // Label
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", midX);
    text.setAttribute("y", sameLane ? midY - 8 : midX > (x1 + x2) / 2 ? midY : midY - 4);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", "10");
    text.setAttribute("font-family", "Inter, system-ui");
    text.setAttribute("fill", conn.color);
    text.setAttribute("opacity", "0.8");
    // bg rect
    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("x", midX - 60); bg.setAttribute("y", (sameLane ? midY - 22 : midY - 14));
    bg.setAttribute("width", 120); bg.setAttribute("height", 14);
    bg.setAttribute("fill", "white"); bg.setAttribute("opacity", "0.85");
    bg.setAttribute("rx", 3);
    svg.appendChild(bg);
    text.textContent = conn.label;
    svg.appendChild(text);
  });
}

// ─── Hover interactions ────────────────────────────────────────────────────────

function setupHover() {
  Object.entries(stepMap).forEach(([id, el]) => {
    el.addEventListener("mouseenter", () => {
      const svg = document.getElementById("svg-overlay");
      svg.querySelectorAll("path").forEach(p => {
        if (p.dataset.from === id || p.dataset.to === id) {
          p.setAttribute("opacity", "1");
          p.setAttribute("stroke-width", "2.5");
          const relId = p.dataset.from === id ? p.dataset.to : p.dataset.from;
          if (stepMap[relId]) stepMap[relId].classList.add("highlighted");
        } else {
          p.setAttribute("opacity", "0.1");
        }
      });
    });
    el.addEventListener("mouseleave", () => {
      const svg = document.getElementById("svg-overlay");
      svg.querySelectorAll("path").forEach(p => {
        p.setAttribute("opacity", "0.65");
        p.setAttribute("stroke-width", "2");
      });
      Object.values(stepMap).forEach(s => s.classList.remove("highlighted"));
    });
  });
}

// ─── Init ─────────────────────────────────────────────────────────────────────

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    drawConnections();
    setupHover();
  });
});

window.addEventListener("resize", () => {
  drawConnections();
});
</script>
</body>
</html>
